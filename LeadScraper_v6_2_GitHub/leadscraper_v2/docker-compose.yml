# B2B AI Lead Scraper — one-command install.
#
#   1. Copy .env.example to .env  (or run ./install.sh, which does it for you)
#   2. docker compose up --build -d
#   3. Open http://localhost:8000
#
# Your data (users, keys, jobs, leads) lives in the `leadscraper-data`
# volume at /app/data, so it survives restarts and rebuilds.

name: lead-scraper

services:
  app:
    build: .
    image: lead-scraper:latest
    container_name: lead-scraper
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - DATA_DIR=/app/data
      - FRONTEND_DIST=/app/frontend/dist
    volumes:
      - leadscraper-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  leadscraper-data:
